[project]
name = "sigil-api"
version = "0.1.0"
description = "Sigil API: product records, serials, Merkle commitments and shopper checks."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "solders>=0.21",
  "python-multipart>=0.0.9",
  "qrcode[pil]>=7.4",
  "reportlab>=4.2",
  "httpx>=0.27",
  "pynacl>=1.5",
  "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
